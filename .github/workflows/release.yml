name: Build and release

on:
  push:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libgpod-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --locked --release

      - name: Package binary
        id: package
        shell: bash
        run: |
          short_sha="$(git rev-parse --short=7 "$GITHUB_SHA")"
          release_name="${GITHUB_REF_NAME}-${short_sha}"
          archive="copyPod-linux-x86_64.tar.gz"

          mkdir -p dist/copyPod-linux-x86_64
          install -m 755 target/release/copyPod dist/copyPod-linux-x86_64/copyPod
          cp README.md LICENSE dist/copyPod-linux-x86_64/
          tar -C dist -czf "dist/${archive}" copyPod-linux-x86_64
          (cd dist && sha256sum "$archive" > "${archive}.sha256")

          echo "release_name=${release_name}" >> "$GITHUB_OUTPUT"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ steps.package.outputs.release_name }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        shell: bash
        run: |
          if gh release view "$RELEASE_NAME" >/dev/null 2>&1; then
            gh release upload "$RELEASE_NAME" \
              "dist/$ARCHIVE" \
              "dist/$ARCHIVE.sha256" \
              --clobber
          else
            gh release create "$RELEASE_NAME" \
              "dist/$ARCHIVE" \
              "dist/$ARCHIVE.sha256" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_NAME" \
              --generate-notes
          fi
