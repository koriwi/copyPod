[package]
name = "copypod"
version = "0.1.0"
edition = "2021"
description = "Mirror local MP3 folders to a classic iPod"
license = "MIT"

[[bin]]
name = "copyPod"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
lofty = "0.22"
walkdir = "2.5"

[build-dependencies]
cc = "1.2"
pkg-config = "0.3"
