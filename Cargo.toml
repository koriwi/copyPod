[package]
name = "copypod"
version = "0.1.0"
edition = "2021"
description = "Mirror local MP3 folders to a classic iPod"
license = "MIT"

[[bin]]
name = "copyPod"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
libopod-rs = "0.1"
tempfile = "3.14"
lofty = "0.22"
walkdir = "2.5"
