[package]
name = "copypod"
version = "0.1.0"
edition = "2021"
description = "Mirror local MP3 folders and M3U playlists to a classic iPod"
license = "MIT"

[features]
default = ["bundled-sqlite"]
bundled-sqlite = ["libopod-rs/bundled-sqlite"]
system-sqlite = ["libopod-rs/system-sqlite"]

[[bin]]
name = "copyPod"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
libopod-rs = { path = "../libopod", default-features = false }
tempfile = "3.14"
lofty = "0.22"
walkdir = "2.5"
